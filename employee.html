<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Portal — Vouchr</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">Vouchr</a>
      <nav class="nav-user">
        <span class="user-label" id="org-display-name">Organization Admin</span>
        <a href="manage-staff.html" class="text-link" id="nav-manage-staff">Manage Team</a>
        <button id="logout-btn" class="text-link" style="background:none;border:none;cursor:pointer;">Log out</button>
      </nav>
    </div>
  </header>

  <main class="dashboard">
    <div class="container">
      <div class="page-header" style="display: flex; justify-content: space-between; align-items: center;">
        <div>
          <p class="eyebrow" id="org-eyebrow">Hope Community Foundation</p>
          <h1>Voucher Issuance & Overview</h1>
        </div>
        <button id="open-issue-modal-btn" class="btn btn-primary">+ Issue New Voucher</button>
      </div>

      <!-- Stats Summary Row -->
      <div class="stats-row">
        <div class="stat-card">
          <span class="stat-value" id="stat-issued-count">0</span>
          <span class="stat-label">Active Vouchers</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="stat-total-issued-value">R 0</span>
          <span class="stat-label">Total Outstanding Value</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="stat-recipient-count">0</span>
          <span class="stat-label">Registered Recipients</span>
        </div>
      </div>

      <!-- Quick Issue Form / Section -->
      <section class="auth-card" style="max-width: 100%; margin-top: 2rem;">
        <h2>Issue Voucher to Recipient</h2>
        <form id="issue-voucher-form" class="auth-form" style="margin-top: 1rem;">
          <div class="form-row">
            <div class="form-group" style="flex: 2;">
              <label for="recipient-select">Select Recipient</label>
              <select id="recipient-select" name="recipient-select" required>
                <option value="" disabled selected>Search by name or SA ID...</option>
                <!-- Populated dynamically via app.js -->
              </select>
            </div>

            <div class="form-group" style="flex: 1;">
              <label for="voucher-amount">Amount (ZAR)</label>
              <input type="number" id="voucher-amount" name="voucher-amount" placeholder="e.g. 250" min="10" required>
            </div>

            <div class="form-group" style="flex: 1;">
              <label for="expiry-days">Valid For (Days)</label>
              <input type="number" id="expiry-days" name="expiry-days" value="30" min="1" required>
            </div>
          </div>

          <button type="submit" class="btn btn-primary">Generate and Issue Voucher</button>
        </form>
      </section>

      <!-- Issued Vouchers Table -->
      <section class="mt-lg">
        <h2>Recently Issued Vouchers</h2>
        <div id="issued-vouchers-container" class="mt-md">
          <!-- Dynamic rendering via JS -->
        </div>
      </section>
    </div>
  </main>

  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
