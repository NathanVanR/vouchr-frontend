<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Vouchers — Vouchr</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">Vouchr</a>
      <nav class="nav-user">
        <span class="user-label" id="user-display-name">Recipient</span>
        <button id="logout-btn" class="text-link" style="background:none;border:none;cursor:pointer;">Log out</button>
      </nav>
    </div>
  </header>

  <main class="dashboard">
    <div class="container">
      <div class="page-header">
        <div>
          <p class="eyebrow" id="greeting-eyebrow">Hello</p>
          <h1>Your active vouchers</h1>
        </div>
      </div>

      <!-- Stats Summary Row -->
      <div class="stats-row">
        <div class="stat-card">
          <span class="stat-value" id="stat-active-count">0</span>
          <span class="stat-label">Active</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="stat-total-value">R 0</span>
          <span class="stat-label">Total value</span>
        </div>
      </div>

      <!-- Dynamic Voucher List Target -->
      <section class="voucher-list" id="voucher-list-container">
        <!-- Javascript populates cards or empty state here -->
      </section>

      <p class="muted center-text mt-lg">
        Present the voucher at any participating store. Staff will scan or enter the code.
      </p>
    </div>
  </main>

  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
