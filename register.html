<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account — Vouchr</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">Vouchr</a>
      <nav>
        <a href="login.html" class="text-link">Already have an account?</a>
      </nav>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <h1>Create your account</h1>
      <p class="muted">Join as a recipient or organization staff member.</p>

      <form id="register-form" class="auth-form">
        <div class="form-group">
          <label>I am registering as</label>
          <div class="role-selector">
            <label class="role-option">
              <input type="radio" name="role" value="recipient" checked>
              <span class="role-card">
                <strong>Recipient</strong>
                <small>I receive and redeem vouchers</small>
              </span>
            </label>
            <label class="role-option">
              <input type="radio" name="role" value="staff">
              <span class="role-card">
                <strong>Organization staff</strong>
                <small>I manage vouchers for an existing organization</small>
              </span>
            </label>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="first-name">First name</label>
            <input 
              type="text" 
              id="first-name" 
              name="first-name" 
              placeholder="First name" 
              required 
              autocomplete="given-name"
            >
          </div>

          <div class="form-group">
            <label for="last-name">Last name</label>
            <input 
              type="text" 
              id="last-name" 
              name="last-name" 
              placeholder="Last name" 
              required 
              autocomplete="family-name"
            >
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="you@example.com" 
            required 
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="••••••••" 
            required 
            minlength="6"
            autocomplete="new-password"
          >
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm password</label>
          <input 
            type="password" 
            id="confirm-password" 
            name="confirm-password" 
            placeholder="••••••••" 
            required 
            minlength="6"
            autocomplete="new-password"
          >
        </div>

        

        <!-- Recipient Specific Fields (Styled seamlessly with existing form structure) -->
        <div id="recipient-fields">
          <div class="form-row">
            <div class="form-group">
              <label for="sa-id">SA ID number</label>
              <input 
                type="text" 
                id="sa-id" 
                name="sa-id" 
                placeholder="13-digit ID number" 
                required 
                pattern="[0-9]{13}"
              >
            </div>

            <div class="form-group">
              <label for="phone-number">Phone number</label>
              <input 
                type="tel" 
                id="phone-number" 
                name="phone-number" 
                placeholder="082 123 4567" 
                required 
                autocomplete="tel"
              >
            </div>
          </div>

          <div class="form-group">
            <label for="street-address">Street address</label>
            <input 
              type="text" 
              id="street-address" 
              name="street-address" 
              placeholder="123 Main Street" 
              required 
              autocomplete="street-address"
            >
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="suburb">Suburb</label>
              <input 
                type="text" 
                id="suburb" 
                name="suburb" 
                placeholder="Suburb" 
                required
              >
            </div>

            <div class="form-group">
              <label for="city">City</label>
              <input 
                type="text" 
                id="city" 
                name="city" 
                placeholder="City" 
                required 
                autocomplete="address-level2"
              >
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="postal-code">Postal code</label>
              <input 
                type="text" 
                id="postal-code" 
                name="postal-code" 
                placeholder="2194" 
                required 
                autocomplete="postal-code"
              >
            </div>

            <div class="form-group">
              <label for="province">Province</label>
              <input 
                type="text" 
                id="province" 
                name="province" 
                placeholder="Gauteng" 
                required 
                autocomplete="address-level1"
              >
            </div>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-full">Create account</button>
      </form>

      <p class="auth-footer muted small">
        Already have an account? <a href="login.html" class="text-link">Sign in</a>
      </p>
      <p class="auth-footer muted small">
        Registering a new organization? <a href="register-org.html" class="text-link">Register here</a>
      </p>
    </div>
  </main>

  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
