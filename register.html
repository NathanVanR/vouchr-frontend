<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account — Vouchr</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">Vouchr</a>
      <nav>
        <a href="login.html" class="text-link">Already have an account?</a>
      </nav>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <h1>Create your account</h1>
      <p class="muted">Join as a recipient or organization staff member.</p>

      <form id="register-form" class="auth-form">
        <div class="form-group">
          <label for="full-name">Full name</label>
          <input 
            type="text" 
            id="full-name" 
            name="full-name" 
            placeholder="Thabo Molefe" 
            required 
            autocomplete="name"
          >
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="you@example.com" 
            required 
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="••••••••" 
            required 
            minlength="6"
            autocomplete="new-password"
          >
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm password</label>
          <input 
            type="password" 
            id="confirm-password" 
            name="confirm-password" 
            placeholder="••••••••" 
            required 
            minlength="6"
            autocomplete="new-password"
          >
        </div>

        <div class="form-group">
          <label>I am registering as</label>
          <div class="role-selector">
            <label class="role-option">
              <input type="radio" name="role" value="recipient" checked>
              <span class="role-card">
                <strong>Recipient</strong>
                <small>I receive and redeem vouchers</small>
              </span>
            </label>
            <label class="role-option">
              <input type="radio" name="role" value="staff">
              <span class="role-card">
                <strong>Organization staff</strong>
                <small>I issue and manage vouchers</small>
              </span>
            </label>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-full">Create account</button>
      </form>

      <p class="auth-footer muted small">
        Already have an account? <a href="login.html" class="text-link">Sign in</a>
      </p>
    </div>
  </main>

  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
