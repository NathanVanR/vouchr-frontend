<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Organization</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">Vouchr</a>
      <nav>
        <a href="staff-dashboard.html" class="text-link">← Back to dashboard</a>
      </nav>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <h1>Register your organization</h1>
      <p class="muted">
        You will be set as the administrator of this organization.
      </p>

      <form id="register-org-form" class="auth-form">
        <!-- Required Organization Information -->
        <div class="form-section">
          <div class="form-group">
            <label for="org-name">Organization name</label>
            <input 
              type="text" 
              id="org-name" 
              name="org-name" 
              placeholder="e.g. Hope Community Foundation" 
              required 
              autocomplete="organization"
            >
          </div>

          <div class="form-group">
            <label for="org-type">Organization type</label>
            <div class="select-wrapper">
              <select id="org-type" name="org-type" required>
                <option value="" disabled selected>Select type</option>
                <option value="nonprofit">Non-Profit / NGO</option>
                <option value="religious">Religious organization</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="org-capability">Organization capability</label>
            <div class="select-wrapper">
              <select id="org-capability" name="org-capability" required>
                <option value="" disabled selected>Select capability</option>
                <option value="ISSUER">I issue vouchers</option>
                <option value="REDEEMER">I redeem vouchers</option>
                <option value="BOTH">I can do both</option>
              </select>
            </div>
          </div>
        </div>

        <hr style="margin: 0.75rem 0; border: none; border-top: 1px solid #eaeaea;">

        <!-- Optional Contact Information -->
        <div class="form-section">
          <h3 style="margin-bottom: 0.25rem;">Contact Details (Optional)</h3>
          <p class="muted small" style="margin-bottom: 0.75rem;">
            If left blank, your personal staff email and phone number will be used automatically.
          </p>
          
          <div class="form-group">
            <label for="org-email">Organization email</label>
            <input 
              type="email" 
              id="org-email" 
              name="org-email" 
              placeholder="e.g. hello@hopecommunity.org"
            >
          </div>

          <div class="form-group">
            <label for="org-phone">Organization phone number</label>
            <input 
              type="tel" 
              id="org-phone" 
              name="org-phone" 
              placeholder="e.g. 011 234 5678"
            >
          </div>
        </div>

        <hr style="margin: 0.75rem 0; border: none; border-top: 1px solid #eaeaea;">

        <!-- Optional Address Information -->
        <div class="form-section">
          <h3 style="margin-bottom: 0.75rem;">Address</h3>
          
          <!-- Unit and Complex (Optional in Java Model) -->
          <div class="form-row" style="display: flex; gap: 1rem;">
            <div class="form-group" style="flex: 1;">
              <label for="org-unit-number">Unit number (Optional)</label>
              <input type="text" id="org-unit-number" name="org-unit-number" placeholder="12">
            </div>
            <div class="form-group" style="flex: 2;">
              <label for="org-complex-name">Complex name (Optional)</label>
              <input type="text" id="org-complex-name" name="org-complex-name" placeholder="The Palms">
            </div>
          </div>

          <!-- Street Details -->
          <div class="form-row" style="display: flex; gap: 1rem;">
            <div class="form-group" style="flex: 1;">
              <label for="org-street-number">Street number</label>
              <input type="text" id="org-street-number" name="org-street-number" placeholder="123">
            </div>
            <div class="form-group" style="flex: 3;">
              <label for="org-street-name">Street name</label>
              <input type="text" id="org-street-name" name="org-street-name" placeholder="Mandela Way">
            </div>
          </div>

          <!-- Suburb, City, Province -->
          <div class="form-row" style="display: flex; gap: 1rem;">
            <div class="form-group" style="flex: 1;">
              <label for="org-suburb">Suburb</label>
              <input type="text" id="org-suburb" name="org-suburb" placeholder="Randburg">
            </div>
            <div class="form-group" style="flex: 1;">
              <label for="org-city">City</label>
              <input type="text" id="org-city" name="org-city" placeholder="Johannesburg">
            </div>
            <div class="form-group" style="flex: 1;">
              <label for="org-province">Province</label>
              <input type="text" id="org-province" name="org-province" placeholder="Gauteng">
            </div>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-full" style="margin-top: 1rem;">
          Create organization
        </button>
      </form>

      <p class="auth-footer muted small">
        Changed your mind? <a href="staff-dashboard.html" class="text-link">Return to dashboard</a>
      </p>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script type="module" src="js/register-org.js"></script>
</body>
</html>
