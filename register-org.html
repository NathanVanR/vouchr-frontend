<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Organization — Vouchr</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">Vouchr</a>
      <nav>
        <a href="staff-dashboard.html" class="text-link">← Back to dashboard</a>
      </nav>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <h1>Register your organization</h1>
      <p class="muted">
        You will be set as the administrator of this organization.
      </p>

      <form id="register-org-form" class="auth-form">
        <!-- Organization Information only -->
        <div class="form-section">
          <div class="form-group">
            <label for="org-name">Organization name</label>
            <input 
              type="text" 
              id="org-name" 
              name="org-name" 
              placeholder="e.g. Hope Community Foundation" 
              required 
              autocomplete="organization"
            >
          </div>

          <div class="form-group">
            <label for="org-type">Organization type</label>
            <div class="select-wrapper">
              <select id="org-type" name="org-type" required>
                <option value="" disabled selected>Select type</option>
                <option value="nonprofit">Non-Profit / NGO</option>
                <option value="religious">Religious organization</option>
              </select>
            </div>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-full">
          Create organization
        </button>
      </form>

      <p class="auth-footer muted small">
        Changed your mind? <a href="staff-dashboard.html" class="text-link">Return to dashboard</a>
      </p>
    </div>
  </main>

  <script type="module" src="js/register-org.js"></script>
</body>
</html>
