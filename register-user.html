<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">Vouchr</a>
      <nav>
        <a href="login.html" class="text-link">Already have an account?</a>
      </nav>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <h1>Create your account</h1>
      <p class="muted">Join as a recipient or organization staff member.</p>
      
      <form id="register-form" class="auth-form">
        <div class="form-group">
          <label>I am registering as</label>
          <div class="role-selector">
            <label class="role-option">
              <input type="radio" name="role" value="recipient" checked>
              <span class="role-card">
                <strong>Recipient</strong>
                <small>I receive and redeem vouchers</small>
              </span>
            </label>
            <label class="role-option">
              <input type="radio" name="role" value="staff">
              <span class="role-card">
                <strong>Organization staff</strong>
                <small>I manage vouchers for an existing organization</small>
              </span>
            </label>
          </div>
        </div>

        <!-- Common Fields for Both Roles -->
        <div class="form-group">
          <label for="first-name">First name</label>
          <input type="text" id="first-name" name="first-name" placeholder="First name" required autocomplete="given-name">
        </div>
        
        <div class="form-group">
          <label for="last-name">Last name</label>
          <input type="text" id="last-name" name="last-name" placeholder="Last name" required autocomplete="family-name">
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="phone-number">Phone number</label>
          <input type="tel" id="phone-number" name="phone-number" placeholder="082 123 4567" autocomplete="tel" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required minlength="6" autocomplete="new-password">
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm password</label>
          <input type="password" id="confirm-password" name="confirm-password" placeholder="••••••••" required minlength="6" autocomplete="new-password">
        </div>

        <!-- Recipient-Specific Fields Group (Hidden when Staff is selected) -->
        <div id="recipient-fields">
          <div class="form-group">
            <label for="sa-id">SA ID number</label>
            <input type="text" id="sa-id" name="sa-id" placeholder="13-digit ID number" pattern="[0-9]{13}">
          </div>

          <div class="form-group">
            <label for="unit-number">Unit number <small class="muted">(Optional)</small></label>
            <input type="text" id="unit-number" name="unit-number" placeholder="Unit 12 / Flat B">
          </div>
          
          <div class="form-group">
            <label for="complex-name">Complex / Building <small class="muted">(Optional)</small></label>
            <input type="text" id="complex-name" name="complex-name" placeholder="Oakridge Manor">
          </div>

          <div class="form-group">
            <label for="street-number">Street no.</label>
            <input type="text" id="street-number" name="street-number" placeholder="123">
          </div>
          
          <div class="form-group">
            <label for="street-name">Street name</label>
            <input type="text" id="street-name" name="street-name" placeholder="Main Street">
          </div>

          <div class="form-group">
            <label for="suburb">Suburb</label>
            <input type="text" id="suburb" name="suburb" placeholder="Suburb">
          </div>
          
          <div class="form-group">
            <label for="city">City</label>
            <input type="text" id="city" name="city" placeholder="City" autocomplete="address-level2">
          </div>

          <div class="form-group">
            <label for="province">Province</label>
            <input type="text" id="province" name="province" placeholder="Gauteng" autocomplete="address-level1">
          </div>
        </div>
        

        <button type="submit" class="btn btn-primary btn-full">Create account</button>
      </form>

      <p class="auth-footer muted small">
        Already have an account? <a href="login.html" class="text-link">Sign in</a>
      </p>
      <p class="auth-footer muted small">
        Registering a new organization? <a href="register-org.html" class="text-link">Register here</a>
      </p>
    </div>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const roleInputs = document.querySelectorAll('input[name="role"]');
      const recipientFields = document.getElementById("recipient-fields");

      const toggleRoleFields = (role) => {
        if (!recipientFields) return;
        const isRecipient = role === "recipient";
        
        // Hide or show the container
        recipientFields.style.display = isRecipient ? "flex" : "none";
        
        // Update required attributes to prevent form submission errors
        recipientFields.querySelectorAll("input").forEach((field) => {
          if (field.id !== "unit-number" && field.id !== "complex-name") {
            field.required = isRecipient;
          }
          // Clear values if hidden
          if (!isRecipient) field.value = ""; 
        });
      };

      // Set initial state based on default selection
      const initialRole = document.querySelector('input[name="role"]:checked')?.value || "recipient";
      toggleRoleFields(initialRole);

      // Listen for radio button clicks
      roleInputs.forEach(input => {
        input.addEventListener("change", (e) => toggleRoleFields(e.target.value));
      });
    });
  </script>

  <script type="module" src="js/register-user.js"></script>
</body>
</html>
