<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Team</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">Vouchr</a>
      <nav class="nav-user">
        <div class="org-switcher-wrapper" id="org-switcher-container" style="display: none;">
          <label for="active-org-select" class="org-switcher-label">Active Organization</label>
          <div class="select-wrapper org-select-wrapper">
            <select id="active-org-select" class="org-select">
            </select>
          </div>
        </div>

        <button type="button" id="nav-menu-btn" class="nav-menu-btn" aria-label="Menu" aria-expanded="false" aria-controls="nav-menu">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>

        <div class="nav-menu" id="nav-menu">
          <a href="staff-dashboard.html" class="text-link">← Back to Portal</a>
          <button id="logout-btn" class="text-link" style="background:none;border:none;cursor:pointer;">Log out</button>
        </div>
      </nav>
    </div>
  </header>

  <main class="dashboard">
    <div class="container">
      <div class="page-header">
        <div>
          <p class="eyebrow" id="org-eyebrow">Organization Administration</p>
          <h1>Team Management</h1>
        </div>
      </div>

      <!-- Section: Add Existing Staff Member -->
      <div class="auth-card" style="max-width: 100%;">
        <h2>Add Staff Member</h2>
        <p class="muted">Enter the email address of a registered staff account to attach them to your organization.</p>
        
        <form id="add-staff-form" class="auth-form" style="margin-top: 1rem;">
          <div class="form-row" style="display: flex; gap: 1rem; align-items: flex-end;">
            <div class="form-group" style="flex: 3;">
              <label for="staff-email">Staff Work Email</label>
              <input 
                type="email" 
                id="staff-email" 
                name="staff-email" 
                placeholder="colleague@organization.org" 
                required
              >
            </div>

            <div class="form-group" style="flex: 2;">
              <label for="staff-role">Role</label>
              <select id="staff-role" name="staff-role" required style="width: 100%; padding: 0.5rem;">
                <option value="STAFF" selected>STAFF</option>
                <option value="ADMIN">ADMIN</option>
              </select>
            </div>

            <div class="form-group" style="flex: 1;">
              <button type="submit" class="btn btn-primary btn-full" id="submit-btn">Add Member</button>
            </div>
          </div>
          <div id="form-message" style="margin-top: 1rem; display: none;"></div>
        </form>
      </div>

      <!-- Section: Active Team Roster -->
      <div class="mt-lg">
        <h2>Current Team Roster</h2>
        <div id="staff-list-container" class="mt-md">
          <!-- Dynamic table populated by manage-staff.js -->
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script type="module" src="js/manage-staff.js"></script>
</body>
</html>
