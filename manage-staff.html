<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Team — Vouchr</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">Vouchr</a>
      <nav class="nav-user">
        <a href="employee.html" class="text-link">← Back to Portal</a>
        <button id="logout-btn" class="text-link" style="background:none;border:none;cursor:pointer;">Log out</button>
      </nav>
    </div>
  </header>

  <main class="dashboard">
    <div class="container">
      <div class="page-header">
        <div>
          <p class="eyebrow" id="org-eyebrow">Organization Administration</p>
          <h1>Team Management</h1>
        </div>
      </div>

      <!-- Section: Add Existing Staff Member -->
      <div class="auth-card" style="max-width: 100%;">
        <h2>Add Staff Member</h2>
        <p class="muted">Enter the email address of a registered staff account to attach them to your organization.</p>
        
        <form id="add-staff-form" class="auth-form" style="margin-top: 1rem;">
          <div class="form-row">
            <div class="form-group" style="flex: 3;">
              <label for="staff-email">Staff Work Email</label>
              <input 
                type="email" 
                id="staff-email" 
                name="staff-email" 
                placeholder="colleague@organization.org" 
                required
              >
            </div>
            <div class="form-group" style="flex: 1; align-self: flex-end;">
              <button type="submit" class="btn btn-primary btn-full">Add Member</button>
            </div>
          </div>
        </form>
      </div>

      <!-- Section: Active Team Roster -->
      <div class="mt-lg">
        <h2>Current Team Roster</h2>
        <div id="staff-list-container" class="mt-md">
          <!-- Dynamic table populated by app.js -->
        </div>
      </div>
    </div>
  </main>

  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
